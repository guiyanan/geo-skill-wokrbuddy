<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>安全验证 - CSDN</title>
</head>
<body class="passport-captcha">
  <!-- 风控页：**同时**有登录表单和验证码。
       这份 fixture 故意两者都放，用来钉住 check_auth 的判定顺序：
       先看验证码（→ unknown + has_captcha），不能看到登录表单就报 expired 然后去重试。 -->
  <div class="login-box">
    <form id="loginForm" class="login-form" action="//passport.csdn.net/v1/register/pc/login/doLogin">
      <input type="text" class="login-form__input" placeholder="手机号/邮箱/用户名">
      <input type="password" class="login-form__input" placeholder="密码">
      <div class="captcha-area">
        <img id="captchaImg" class="captcha-img" src="/captcha/abc123.png" alt="验证码">
        <input type="text" class="captcha-input" placeholder="请输入验证码">
      </div>
      <button class="login-form__button" type="submit">登录</button>
    </form>
  </div>
</body>
</html>
