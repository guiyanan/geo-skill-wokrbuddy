<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>登录 - CSDN</title>
</head>
<body class="passport-login">
  <!-- 被踢回登录页：这里只有登录表单，没有头像、没有验证码。
       选择器 auth.login_form -->
  <div class="login-box">
    <form id="loginForm" class="login-form" action="//passport.csdn.net/v1/register/pc/login/doLogin">
      <div class="login-form__tab">密码登录</div>
      <input type="text" class="login-form__input" placeholder="手机号/邮箱/用户名">
      <input type="password" class="login-form__input" placeholder="密码">
      <button class="login-form__button" type="submit">登录</button>
    </form>
  </div>
</body>
</html>
