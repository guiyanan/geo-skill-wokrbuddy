name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit + contract
    runs-on: ubuntu-latest
    outputs:
      has_integration: ${{ steps.detect.outputs.has_integration }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # 判断集成测试是否已存在，决定 integration job 是否运行
      - name: Detect test layers
        id: detect
        run: |
          n=$(find tests/integration -name 'test_*.py' 2>/dev/null | wc -l | tr -d ' ')
          if [ "$n" -gt 0 ]; then
            echo "has_integration=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_integration=false" >> "$GITHUB_OUTPUT"
          fi

      # 红线门禁：禁验证码处理代码、禁裸选择器。便宜（<1s）且拦的是不可逆后果，
      # 排在单元测试前面 —— 红得越早越省事。
      - name: Static gates (red lines)
        run: python .precommit/run_gates.py

      - name: Unit tests
        run: pytest -m unit

      # 空集合时 pytest 返回 5（no tests collected），属正常状态而非失败。
      # 仅在「确实没有测试文件」时容忍；有文件却收集不到 → 仍然红。
      - name: Contract tests (DOM fixtures, no network)
        run: |
          n=$(find tests/contract -name 'test_*.py' 2>/dev/null | wc -l | tr -d ' ')
          if [ "$n" -eq 0 ]; then
            echo "::notice::tests/contract 暂无测试（T-05 前属正常状态）"
            exit 0
          fi
          pytest -m contract

      # 覆盖门禁：unit 与 contract 合并统计（adapters 的生产代码主要由 contract 覆盖）。
      # 定死 100%：不加这道，覆盖率只会悄悄退化 —— 前面几张工单的教训是
      # 「全绿 + 100%」仍可能藏着没被断言的行为，但掉了 100% 一定是真漏了。
      - name: Coverage gate (unit + contract, 100%)
        run: pytest -m "unit or contract" --cov=geopublish --cov-fail-under=100

  integration:
    name: integration (real browser, fake site)
    runs-on: ubuntu-latest
    needs: unit
    if: ${{ needs.unit.outputs.has_integration == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install Chromium for Playwright
        run: playwright install --with-deps chromium

      - name: Integration tests
        run: pytest -m integration
